<!doctype html>
<!-- The drawer cases' page: an empty main the cases mount sl-drawer into, with no heading of its
     own, so the drawer's is the one the page exposes. It links the installed foundation's full
     entry, page-full.css, and sets no profile. window.ready settles once the entry's sheet loads.
     Lit's and the foundation's bare specifiers map onto /deps/, where the server answers with the
     installed packages; the foundation's map onto its dist/, as its exports do.
     Adapted from spike-html-apps-components (51d2b92): test/fixtures/components.html, its import
     map and its sheet's settling, without its modules and its verdict. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>drawer cases</title>
    <script>
      {
        const link = document.head.appendChild(document.createElement("link"));
        link.rel = "stylesheet";
        window.ready = new Promise((resolve, reject) => {
          link.onload = resolve;
          link.onerror = () => reject(new Error(`no sheet ${link.href}`));
        });
        link.href = "/deps/@jaimestill/spike-html-apps-foundation/dist/page-full.css";
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "@jaimestill/spike-html-apps-foundation/": "/deps/@jaimestill/spike-html-apps-foundation/dist/"
        }
      }
    </script>
  </head>
  <body>
    <main></main>
  </body>
</html>
