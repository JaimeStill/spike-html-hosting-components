<!doctype html>
<!-- The fourth fixture site's index page, served at /spike-html-hosting-fourth/ on the same origin
     as the other fixture sites: a site deployed ahead of them, on a release of the components that
     lists it. It loads the site nav from served.ts's AHEAD_MODULE, the built module with the
     fourth site added to its SITES, so with no src its nav lists four sites where the sqlate
     site's lists three. The page's ?src=, when it has one, becomes the nav's src.
     window.errors collects every error and unhandled rejection the page raises; window.ready
     settles once the site nav has rendered.
     From sites/spike-html-hosting-sqlate/index.html: the page and its palettes, flexoki and primer,
     the site nav the ahead module. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fourth</title>
    <script>
      window.errors = [];
      window.addEventListener("error", (event) => window.errors.push(String(event.message)));
      window.addEventListener("unhandledrejection", (event) =>
        window.errors.push(String(event.reason)),
      );
    </script>
    <link rel="stylesheet" href="/deps/@jaimestill/spike-html-apps-foundation/dist/page.css" />
    <link rel="stylesheet" href="/deps/@jaimestill/spike-html-apps-foundation/dist/profiles/color/primer.css" />
    <style>
      /* The fixture's page layout, the page's: the site nav and the Theme button in a row above
         the article. */
      body {
        display: grid;
        align-content: start;
        gap: var(--space-l);
        padding: var(--space-m);
      }
      body > header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-s);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "@jaimestill/spike-html-apps-foundation/": "/deps/@jaimestill/spike-html-apps-foundation/dist/"
        }
      }
    </script>
    <script type="module" blocking="render" src="/deps/@jaimestill/spike-html-apps-foundation/dist/register.js"></script>
    <script type="module" blocking="render" src="/deps/@jaimestill/spike-html-apps-foundation/dist/profiles/color/primer.js"></script>
    <script type="module" blocking="render" src="/deps/@jaimestill/spike-html-apps-foundation/dist/preferences.js"></script>
    <script type="module" blocking="render" src="/deps/@jaimestill/spike-html-apps-foundation/dist/keys.js"></script>
    <script type="module">
      import "/dist/site-nav.js?ahead";

      window.ready = customElements
        .whenDefined("sl-site-nav")
        .then(() => document.querySelector("sl-site-nav").updateComplete);
    </script>
  </head>
  <body>
    <header>
      <sl-site-nav></sl-site-nav>
      <script>
        // The page's ?src=, when it has one, becomes the nav's src before the nav upgrades.
        const src = new URLSearchParams(location.search).get("src");
        if (src !== null) document.currentScript.previousElementSibling.setAttribute("src", src);
      </script>
      <button type="button" commandfor="theme" command="--open" data-keys="t">Theme</button>
    </header>
    <main>
      <h1>Fourth</h1>
      <p>The fourth fixture site's page: deployed ahead of the other sites, its site nav lists this site, which theirs list only once their nav fetches the org's list.</p>
    </main>
    <sl-theme-menu id="theme"></sl-theme-menu>
  </body>
</html>
