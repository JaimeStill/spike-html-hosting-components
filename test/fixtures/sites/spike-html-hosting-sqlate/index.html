<!doctype html>
<!-- The sqlate fixture site's index page, served at /spike-html-hosting-sqlate/ on the same origin
     as the architecture fixture site, so the two share its storage and the reader's theme in it.
     It heads the page with sl-site-nav and the Theme button, as the architecture site does, and
     registers fewer palettes: the foundation's lean entry, page.css, with primer's sheet linked
     after it, then register.js and primer's registration module, preferences.js, and keys.js
     render-blocking. Its palettes are flexoki, the default, and primer, so a stored palette the
     architecture site registers and this one doesn't, catppuccin or everforest, falls back to
     flexoki here and stays stored.
     window.errors collects every error and unhandled rejection the page raises; window.ready
     settles once the site nav has rendered. The import map is the architecture site's.
     Adapted from sites/spike-html-hosting-architecture/index.html: its loading, its error log, and
     its import map, the entry the lean one. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sqlate</title>
    <script>
      window.errors = [];
      window.addEventListener("error", (event) => window.errors.push(String(event.message)));
      window.addEventListener("unhandledrejection", (event) =>
        window.errors.push(String(event.reason)),
      );
    </script>
    <link rel="stylesheet" href="/deps/@jaimestill/spike-html-apps-foundation/dist/page.css" />
    <link rel="stylesheet" href="/deps/@jaimestill/spike-html-apps-foundation/dist/profiles/color/primer.css" />
    <style>
      /* The fixture's page layout, the page's: the site nav and the Theme button in a row above
         the article. */
      body {
        display: grid;
        align-content: start;
        gap: var(--space-l);
        padding: var(--space-m);
      }
      body > header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-s);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "@jaimestill/spike-html-apps-foundation/": "/deps/@jaimestill/spike-html-apps-foundation/dist/"
        }
      }
    </script>
    <script type="module" blocking="render" src="/deps/@jaimestill/spike-html-apps-foundation/dist/register.js"></script>
    <script type="module" blocking="render" src="/deps/@jaimestill/spike-html-apps-foundation/dist/profiles/color/primer.js"></script>
    <script type="module" blocking="render" src="/deps/@jaimestill/spike-html-apps-foundation/dist/preferences.js"></script>
    <script type="module" blocking="render" src="/deps/@jaimestill/spike-html-apps-foundation/dist/keys.js"></script>
    <script type="module">
      import "/dist/site-nav.js";

      window.ready = customElements
        .whenDefined("sl-site-nav")
        .then(() => document.querySelector("sl-site-nav").updateComplete);
    </script>
  </head>
  <body>
    <header>
      <sl-site-nav></sl-site-nav>
      <button type="button" commandfor="theme" command="--open" data-keys="t">Theme</button>
    </header>
    <main>
      <h1>sqlate</h1>
      <p>The sqlate fixture site's page: the site nav above links each site the components list, and the theme the reader saved on any of them applies here before first paint.</p>
    </main>
    <sl-theme-menu id="theme"></sl-theme-menu>
  </body>
</html>
